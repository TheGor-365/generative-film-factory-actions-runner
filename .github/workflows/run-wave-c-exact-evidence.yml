name: Run Wave C Exact Actions Evidence

on:
  workflow_dispatch:
    inputs:
      private_sha:
        description: Coordinator-frozen exact lowercase 40-character private main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gff-wave-c-exact-evidence
  cancel-in-progress: false

jobs:
  validate-wave-c-exact-sha:
    name: validate-wave-c-exact-sha
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GATE_ID: GFF_WAVE_C_G1_V03_VALIDATION_v01
      PRIVATE_REPO: TheGor-365/generative-film-factory-control-center
      PRIVATE_BRANCH: main
      PRIVATE_SHA: ${{ inputs.private_sha }}
      STATUS_CONTEXT: public-runner/gff/wave-c-validation
      GFF_WAVE_C_WORK_ROOT: ${{ runner.temp }}/gff-wave-c-${{ github.run_id }}

    steps:
      - name: Checkout public runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate fixed dispatch policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GATE_ID" == "GFF_WAVE_C_G1_V03_VALIDATION_v01" ]]
          [[ "$PRIVATE_REPO" == "TheGor-365/generative-film-factory-control-center" ]]
          [[ "$PRIVATE_BRANCH" == "main" ]]
          [[ "$STATUS_CONTEXT" == "public-runner/gff/wave-c-validation" ]]
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("contracts/GFF_WAVE_C_G1_V03_VALIDATION_v01.json").read_text(encoding="utf-8"))
          expected = {
              "gate_id": "GFF_WAVE_C_G1_V03_VALIDATION_v01",
              "private_repository": "TheGor-365/generative-film-factory-control-center",
              "allowed_branch": "main",
              "status_context": "public-runner/gff/wave-c-validation",
              "workflow_inputs": ["private_sha"],
              "arbitrary_shell_allowed": False,
              "public_artifact_upload": False,
              "cache": False,
              "paid_provider_calls": False,
              "network_media_provider_calls": False,
              "no_fake_green": True,
          }
          for key, value in expected.items():
              if contract.get(key) != value:
                  raise SystemExit(f"POLICY_ERROR=CONTRACT_{key.upper()}_MISMATCH")
          print("FIXED_DISPATCH_POLICY=PASS")
          PY

      - name: Checkout allowlisted private main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheGor-365/generative-film-factory-control-center
          ref: main
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-checkout
          fetch-depth: 1
          persist-credentials: false

      - name: Verify private main head and detach exact SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C private-checkout rev-parse HEAD)"
          if [[ "$actual_sha" != "$PRIVATE_SHA" ]]; then
            printf '%s\n' "POLICY_ERROR=PRIVATE_MAIN_SHA_MISMATCH"
            exit 2
          fi
          git -C private-checkout checkout --detach "$PRIVATE_SHA" >/dev/null 2>&1
          [[ "$(git -C private-checkout rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ -z "$(git -C private-checkout status --porcelain)" ]]
          printf '%s\n' "PRIVATE_MAIN_SHA_MATCH=true" "DETACHED_PRIVATE_SHA_CHECKOUT=true"

      - name: Execute fixed Wave C matrix
        id: gate
        shell: bash
        run: bash scripts/run_wave_c_exact_gate.sh private-checkout

      - name: Always cleanup private checkout and runtime roots
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- private-checkout "$GFF_WAVE_C_WORK_ROOT"
          [[ ! -e private-checkout ]]
          [[ ! -e "$GFF_WAVE_C_WORK_ROOT" ]]
          printf '%s\n' \
            "PRIVATE_CHECKOUT_DELETED=true" \
            "RUNTIME_AND_ARTIFACT_ROOTS_DELETED=true" \
            "PUBLIC_ARTIFACT_UPLOAD_ACTION_PRESENT=false" \
            "CACHE_ACTION_PRESENT=false" \
            "NO_FAKE_GREEN=true"
