name: Diagnose FMR005 Repair004 Failure Metadata K5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-fmr005-repair004:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'coord/diagnose-fmr005-repair004-failure-k5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Emit sanitized deterministic component metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/diagnose_fmr005_repair004_failure_k5.py?ref=${GITHUB_HEAD_REF}" --output /tmp/diagnose.py
          python /tmp/diagnose.py
