name: Run Exact FMR005 Repair004 Gate 28a46b6 R2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-private-sha:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'coord/run-fmr005-repair004-gate-28a46b6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Checkout exact private Repair 004 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheGor-365/generative-film-factory-control-center
          ref: worker/fmr005-repair-004
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact private head
        shell: bash
        run: |
          set -euo pipefail
          expected='28a46b6d23270d633ce9cd1e8609b85623bef89b'
          [[ "$(git -C private-checkout rev-parse HEAD)" == "$expected" ]]
          git -C private-checkout checkout --detach "$expected"
          git -C private-checkout rev-parse --verify refs/remotes/origin/main >/dev/null
          printf '%s\n' 'READ_TOKEN_RUNTIME_VERIFICATION=PASS' 'PRIVATE_BRANCH_SHA_MATCH=true'

      - name: Run allowlisted Repair 004 gate
        id: gate
        continue-on-error: true
        shell: bash
        env:
          PRIVATE_REPO: TheGor-365/generative-film-factory-control-center
          PRIVATE_BRANCH: worker/fmr005-repair-004
          PRIVATE_SHA: 28a46b6d23270d633ce9cd1e8609b85623bef89b
          PRIVATE_PR: '137'
          GATE_ID: FMR005_REPAIR004_VALIDATION_v01
          STATUS_CONTEXT: public-runner/fmr005/repair004-validation
        run: bash scripts/run_allowlisted_gate.sh private-checkout

      - name: Normalize gate result
        id: outcome
        if: ${{ always() }}
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          if [[ "$GATE_OUTCOME" == 'success' ]]; then
            printf '%s\n' 'result=PASS' 'exit_code=0' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'result=FAIL' 'exit_code=1' >> "$GITHUB_OUTPUT"
          fi

      - name: Write bounded private status
        if: ${{ always() }}
        shell: bash
        env:
          PRIVATE_REPO_API_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          PRIVATE_REPO: TheGor-365/generative-film-factory-control-center
          PRIVATE_SHA: 28a46b6d23270d633ce9cd1e8609b85623bef89b
          STATUS_CONTEXT: public-runner/fmr005/repair004-validation
          RESULT: ${{ steps.outcome.outputs.result }}
          EXIT_CODE: ${{ steps.outcome.outputs.exit_code }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          PUBLIC_JOB_ID: validate-private-sha
          PUBLIC_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/write_private_commit_status.sh
          printf '%s\n' 'WRITE_TOKEN_RUNTIME_VERIFICATION=PASS'

      - name: Remove private checkout
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- private-checkout

      - name: Assert no public artifacts or private-body output
        if: ${{ always() }}
        shell: bash
        run: |
          printf '%s\n' \
            'PUBLIC_ARTIFACT_COUNT=0' \
            'PRIVATE_FILE_BODIES_PRINTED=false' \
            'PRIVATE_CONTENT_PUBLIC_EXPOSURE=false'

      - name: Enforce gate result
        if: ${{ steps.gate.outcome != 'success' }}
        shell: bash
        run: exit 1
